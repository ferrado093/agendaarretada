<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Arretada</title>
<style>
:root{--bg:#000000;--card:#141414;--line:#333333;--txt:#FFFFFF;--mut:#A6A6A6;--acc:#FFFFFF;--acc2:#D9D9D9;--on:#000000;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#FFFFFF;--card:#F2F2F2;--line:#D0D0D0;--txt:#000000;--mut:#5C5C5C;--acc:#000000;--acc2:#262626;--on:#FFFFFF;color-scheme:light}}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:880px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.9rem;margin:0}
.sub{color:var(--mut);margin:2px 0 18px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--acc);color:var(--on);border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}
button:hover{background:var(--acc2)}
button.sec{background:transparent;border:1px solid var(--line);color:var(--txt)}
button.sec.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
button.sec:hover{background:var(--line)}
button.sec.on:hover{background:var(--acc2)}
button.bad{background:var(--bad);color:#fff}
button.bad:hover{background:var(--bad);filter:brightness(1.15)}
button.sm{padding:5px 10px;font-size:.85rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
label{display:block;font-size:.88rem;color:var(--mut);margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:6px;margin:0;color:var(--txt);border:1px solid var(--line);border-radius:20px;padding:4px 12px;cursor:pointer}
.chips input{width:auto}
.dia{color:var(--mut);font-weight:600;margin:18px 0 8px}
.item{display:flex;gap:14px;align-items:flex-start;border-left:4px solid var(--acc);flex-wrap:wrap}
.item.alta{border-color:var(--mut)}.item.urgente{border-color:var(--bad)}.item.baixa{border-color:var(--line)}
.item.concluido{opacity:.55}.item.concluido .t{text-decoration:line-through}
.hora{font-weight:700;font-size:1.15rem;min-width:56px}
.corpo{flex:1;min-width:180px}.t{font-weight:600}
.meta{color:var(--mut);font-size:.88rem}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
.vazio{color:var(--mut);text-align:center;padding:28px 8px}
.modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.modos button{text-align:left;border-radius:12px;padding:12px}
.modos small{display:block;font-weight:400;opacity:.85}
#toasts{position:fixed;right:12px;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:460px;margin-left:auto;display:flex;flex-direction:column;gap:8px;z-index:20}
.toast{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast p{margin:0 0 8px}
.toast.alarme{border-color:var(--bad);border-width:2px}
.hid{display:none}
.nota{font-size:.85rem;color:var(--mut)}
@media (max-width:520px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Agenda Arretada</h1>
  <p class="sub">Seus compromissos, do seu jeito.</p>

  <div class="tabs" role="tablist">
    <button class="sec on" data-aba="comp">Compromissos</button>
    <button class="sec" data-aba="pers">Personalidade e voz</button>
  </div>

  <section id="comp">
    <div class="bar">
      <button id="novo">+ Novo compromisso</button>
      <select id="filtro" style="width:auto" aria-label="Filtrar por situação">
        <option value="pendente">Pendentes</option><option value="concluido">Concluídos</option>
        <option value="">Todos</option>
      </select>
    </div>

    <div id="form" class="card hid">
      <strong id="formTitulo">Novo compromisso</strong>
      <label for="fTitulo">Título *</label><input id="fTitulo" maxlength="200">
      <div class="row">
        <div><label for="fData">Data</label><input id="fData" type="date"></div>
        <div><label for="fHora">Horário</label><input id="fHora" type="time"></div>
      </div>
      <div class="row">
        <div><label for="fCat">Categoria</label>
          <select id="fCat"><option>Pessoal</option><option>Trabalho</option><option>Reunião</option><option>Audiência</option><option>Saúde</option><option>Estudos</option><option>Outros</option></select></div>
        <div><label for="fPri">Prioridade</label>
          <select id="fPri"><option value="baixa">Baixa</option><option value="normal" selected>Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></div>
      </div>
      <label for="fLocal">Local</label><input id="fLocal">
      <label for="fDesc">Descrição / observações</label><textarea id="fDesc" rows="2"></textarea>
      <label>Avisos</label>
      <div class="chips" id="fLeads"></div>
      <label for="fLeadX">Aviso personalizado (minutos antes, opcional)</label>
      <input id="fLeadX" type="number" min="1" max="10080" placeholder="Ex.: 45">
      <div class="bar" style="margin:16px 0 0"><span id="erro" class="meta" style="color:#F08A8A"></span>
        <span><button class="sec" id="cancelar">Cancelar</button> <button id="salvar">Salvar</button></span></div>
    </div>

    <div id="lista"></div>
  </section>

  <section id="pers" class="hid">
    <div class="card">
      <strong>Como a agenda fala com você</strong>
      <div class="modos" id="modos" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <label for="saida" style="margin-top:0">Avisos</label>
      <select id="saida"><option value="ambos">Texto e voz</option><option value="texto">Só texto</option><option value="voz">Só voz</option></select>
      <label for="voz">Voz</label><select id="voz"></select>
      <label for="vel">Velocidade da fala: <span id="velV"></span></label>
      <input id="vel" type="range" min="0.6" max="1.6" step="0.1">
      <label for="custom">Sua própria frase para este modo (use {titulo}, {quando} e {hora})</label>
      <textarea id="custom" rows="2" placeholder="Deixe vazio para usar a frase padrão"></textarea>
      <div class="bar" style="margin:14px 0 0"><span id="previa" class="meta"></span><button id="demo">Ouvir demonstração</button></div>
    </div>
    <p class="nota">Os lembretes só disparam com esta página aberta no navegador. Os dados ficam salvos neste aparelho.</p>
  </section>
</main>
<div id="toasts" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);
const KEY='agendaArretada.web.v1';
let S={ags:[],cfg:{modo:'nordestino',saida:'ambos',rate:1,voice:'',custom:{}},fired:{},snoozes:[],next:1};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);S=Object.assign(S,p);S.cfg=Object.assign({modo:'nordestino',saida:'ambos',rate:1,voice:'',custom:{}},p.cfg||{})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};if(window.__sync)window.__sync()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LEADS=[[1440,'1 dia antes'],[120,'2 h antes'],[60,'1 h antes'],[30,'30 min antes'],[15,'15 min antes'],[5,'5 min antes'],[0,'No horário']];
const MODOS={
 gentil:{nome:'Gentil',desc:'Educado e carinhoso',f:'Olá! Você tem “{titulo}” {quando}. Não se esqueça de se preparar. Tenha um excelente dia!'},
 nordestino:{nome:'Nordestino',desc:'Oxente, visse?',f:'Oxente, meu patrão! “{titulo}” {quando}! Bora se organizar, visse?'},
 profissional:{nome:'Profissional',desc:'Direto e objetivo',f:'Lembrete: {titulo} {quando}, às {hora}.'},
 bronca:{nome:'Bronca',desc:'Sem moleza',f:'EI, JUMENTO! TÁ NA HORA DE SE ORGANIZAR! {TITULO} {QUANDO}!'}
};
function quando(min){
 if(min<=0)return 'agora';
 if(min>=1440){const d=Math.round(min/1440);return 'daqui a '+d+(d>1?' dias':' dia')}
 if(min>=60){const h=Math.round(min/60);return 'daqui a '+h+(h>1?' horas':' hora')}
 return 'daqui a '+min+(min>1?' minutos':' minuto');
}
function montar(a,min){
 const m=MODOS[S.cfg.modo]; let f=(S.cfg.custom[S.cfg.modo]||'').trim()||m.f;
 const hora=a.dt.slice(11,16),q=quando(min);
 return f.replace(/\{TITULO\}/g,a.titulo.toUpperCase()).replace(/\{QUANDO\}/g,q.toUpperCase())
  .replace(/\{titulo\}/g,a.titulo).replace(/\{quando\}/g,q).replace(/\{hora\}/g,hora);
}
/* voz */
let vozes=[];
function carregarVozes(){
 if(!('speechSynthesis' in window))return;
 vozes=speechSynthesis.getVoices();
 const pt=vozes.filter(v=>/^pt/i.test(v.lang)),lista=pt.length?pt:vozes;
 $('#voz').innerHTML='<option value="">Padrão do aparelho</option>'+lista.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');
 $('#voz').value=S.cfg.voice;
}
function falar(txt){
 if(!('speechSynthesis' in window))return;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';u.rate=S.cfg.rate;
  const v=vozes.find(v=>v.name===S.cfg.voice);if(v){u.voice=v;u.lang=v.lang}speechSynthesis.speak(u)}catch(e){}
}
/* lembretes */
function avisar(a,min){
 const txt=montar(a,min);
 if(S.cfg.saida!=='voz')toast(a,txt);else toast(a,txt,true);
 if(S.cfg.saida!=='texto')falar(txt);
}
/* alarme: toca se o aviso ficar 1 min sem ser concluído */
let actx=null,alarmeInt=null;const alarmes=new Set();
function audio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}}
document.addEventListener('click',audio);
function bip(f,ini,dur){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+ini;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05)}
function iniciarAlarme(){if(alarmeInt)return;const toca=()=>{bip(880,0,.18);bip(1175,.25,.18);bip(880,.5,.18)};toca();alarmeInt=setInterval(toca,1500)}
function pararAlarme(){if(!alarmes.size&&alarmeInt){clearInterval(alarmeInt);alarmeInt=null}}
function encerrar(d){clearTimeout(d._t);alarmes.delete(d);d.remove();pararAlarme()}
function limparToasts(id){document.querySelectorAll('.toast').forEach(t=>{if(t._id===id)encerrar(t)})}
function toast(a,txt,mudo){
 const d=document.createElement('div');d.className='toast';d._id=a.id;
 d.innerHTML=`<p>${esc(txt)}</p><p class="meta al hid">Alarme tocando. Clique em Concluir para parar.</p><div class="acoes"><button class="sm" data-x="ok">Concluir</button><button class="sm sec" data-x="adiar">Adiar 5 min</button></div>`;
 d.onclick=e=>{const x=e.target.dataset.x;if(!x)return;
  if(x==='ok'){a.estado='concluido'}
  if(x==='adiar'){S.snoozes.push({id:a.id,at:Date.now()+300000})}
  save();encerrar(d);render()};
 d._t=setTimeout(()=>{alarmes.add(d);d.classList.add('alarme');d.querySelector('.al').classList.remove('hid');iniciarAlarme()},60000);
 $('#toasts').appendChild(d);
}
function tick(){
 const now=Date.now();let mudou=false;
 for(const a of S.ags){
  if(a.estado!=='pendente')continue;
  const t=new Date(a.dt).getTime();
  for(const m of a.leads){
   const k=a.id+':'+m;if(S.fired[k])continue;
   if(now>=t-m*60000){S.fired[k]=1;mudou=true;
    if(now>t+300000)perdidos.push(a);else avisar(a,Math.max(0,Math.round((t-now)/60000)))}
  }
 }
 S.snoozes=S.snoozes.filter(s=>{
  if(now<s.at)return true;
  const a=S.ags.find(x=>x.id===s.id);
  if(a&&a.estado==='pendente'){avisar(a,Math.max(0,Math.round((new Date(a.dt)-now)/60000)))}
  mudou=true;return false});
 if(perdidos.length){
  const n=perdidos.length;perdidos=[];
  const d=document.createElement('div');d.className='toast';
  d.innerHTML=`<p>Você tinha ${n} aviso(s) que passaram enquanto a página estava fechada. Confira sua lista.</p><button class="sm sec">Fechar</button>`;
  d.onclick=()=>d.remove();$('#toasts').appendChild(d)}
 if(mudou)save();
}
let perdidos=[];
/* lista */
function render(){
 const f=$('#filtro').value;
 const L=S.ags.filter(a=>!f||a.estado===f).sort((x,y)=>x.dt.localeCompare(y.dt));
 if(!L.length){$('#lista').innerHTML='<div class="vazio">Nenhum compromisso por aqui. Toque em “Novo compromisso” para começar.</div>';return}
 let h='',dia='';
 for(const a of L){
  const d=a.dt.slice(0,10);
  if(d!==dia){dia=d;h+=`<div class="dia">${new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>`}
  h+=`<div class="card item ${a.prioridade} ${a.estado}"><div class="hora">${a.dt.slice(11,16)}</div>
  <div class="corpo"><div class="t">${esc(a.titulo)}</div>
  <div class="meta">${esc(a.cat)} · ${esc(a.prioridade)}${a.local?' · '+esc(a.local):''}${a.estado!=='pendente'?' · '+esc(a.estado):''}</div>
  ${a.desc?`<div class="meta">${esc(a.desc)}</div>`:''}</div>
  <div class="acoes">${a.estado==='pendente'?`<button class="sm" data-a="ok" data-id="${a.id}">Concluir</button>`:''}
  <button class="sm sec" data-a="ed" data-id="${a.id}">Editar</button>
  <button class="sm bad" data-a="del" data-id="${a.id}">Excluir</button></div></div>`;
 }
 $('#lista').innerHTML=h;
}
$('#lista').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 const a=S.ags.find(x=>x.id==b.dataset.id);if(!a)return;
 if(b.dataset.a==='ok'){a.estado='concluido';limparToasts(a.id)}
 if(b.dataset.a==='del'){if(!confirm('Excluir este compromisso?'))return;limparToasts(a.id);S.ags=S.ags.filter(x=>x!==a)}
 if(b.dataset.a==='ed'){abrirForm(a);return}
 save();render();
};
$('#filtro').onchange=render;
/* formulário */
let editando=null;
$('#fLeads').innerHTML=LEADS.map(([m,n])=>`<label><input type="checkbox" value="${m}"> ${n}</label>`).join('');
function abrirForm(a){
 editando=a||null;$('#erro').textContent='';
 $('#formTitulo').textContent=a?'Editar compromisso':'Novo compromisso';
 const agora=new Date(Date.now()+3600000),p=n=>String(n).padStart(2,'0');
 $('#fTitulo').value=a?a.titulo:'';
 $('#fData').value=a?a.dt.slice(0,10):`${agora.getFullYear()}-${p(agora.getMonth()+1)}-${p(agora.getDate())}`;
 $('#fHora').value=a?a.dt.slice(11,16):`${p(agora.getHours())}:00`;
 $('#fCat').value=a?a.cat:'Pessoal';$('#fPri').value=a?a.prioridade:'normal';
 $('#fLocal').value=a?a.local:'';$('#fDesc').value=a?a.desc:'';
 const leads=a?a.leads:[30,0];
 document.querySelectorAll('#fLeads input').forEach(c=>c.checked=leads.includes(+c.value));
 const extra=leads.find(m=>!LEADS.some(l=>l[0]===m));$('#fLeadX').value=extra||'';
 $('#form').classList.remove('hid');$('#fTitulo').focus();
}
$('#novo').onclick=()=>abrirForm();
$('#cancelar').onclick=()=>$('#form').classList.add('hid');
$('#salvar').onclick=()=>{
 const titulo=$('#fTitulo').value.trim(),d=$('#fData').value,h=$('#fHora').value;
 if(!titulo){$('#erro').textContent='O título é obrigatório.';return}
 if(!d||!h){$('#erro').textContent='Informe data e horário.';return}
 const leads=[...document.querySelectorAll('#fLeads input:checked')].map(c=>+c.value);
 const x=parseInt($('#fLeadX').value,10);if(x>0&&!leads.includes(x))leads.push(x);
 const dados={titulo,dt:d+'T'+h,cat:$('#fCat').value,prioridade:$('#fPri').value,local:$('#fLocal').value.trim(),desc:$('#fDesc').value.trim(),leads};
 if(editando){
  const mudouHora=editando.dt!==dados.dt;
  Object.assign(editando,dados);
  for(const k of Object.keys(S.fired))if(k.startsWith(editando.id+':')&&(mudouHora||true))delete S.fired[k];
 }else S.ags.push(Object.assign({id:S.next++,estado:'pendente'},dados));
 save();$('#form').classList.add('hid');render();tick();
};
/* abas e personalidade */
document.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('[data-aba]').forEach(x=>x.classList.toggle('on',x===b));
 $('#comp').classList.toggle('hid',b.dataset.aba!=='comp');$('#pers').classList.toggle('hid',b.dataset.aba!=='pers');
});
function renderModos(){
 $('#modos').innerHTML=Object.entries(MODOS).map(([k,m])=>`<button class="${k===S.cfg.modo?'':'sec'}" data-m="${k}">${m.nome}<small>${m.desc}</small></button>`).join('');
 $('#custom').value=S.cfg.custom[S.cfg.modo]||'';
 previa();
}
function previa(){
 $('#previa').textContent=montar({titulo:'Reunião com o cliente',dt:'2026-01-01T14:30'},30);
}
$('#modos').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.cfg.modo=b.dataset.m;save();renderModos()};
$('#saida').onchange=e=>{S.cfg.saida=e.target.value;save()};
$('#voz').onchange=e=>{S.cfg.voice=e.target.value;save()};
$('#vel').oninput=e=>{S.cfg.rate=+e.target.value;$('#velV').textContent=S.cfg.rate.toFixed(1)+'×';save()};
$('#custom').oninput=e=>{S.cfg.custom[S.cfg.modo]=e.target.value;save();previa()};
$('#demo').onclick=()=>{
 const t=$('#previa').textContent;
 if(!('speechSynthesis' in window)){alert('Este navegador não oferece voz. Os avisos aparecerão só em texto.');return}
 falar(t);
};
$('#saida').value=S.cfg.saida;$('#vel').value=S.cfg.rate;$('#velV').textContent=S.cfg.rate.toFixed(1)+'×';
if('speechSynthesis' in window){carregarVozes();speechSynthesis.onvoiceschanged=carregarVozes}

/* ===== Android (Capacitor): avisos agendados no sistema, funcionam com o app fechado ===== */
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const LN=NATIVE?(Capacitor.Plugins||{}).LocalNotifications:null;
function mkNotif(id,title,body,at,a){return{id,title,body,schedule:{at:new Date(at),allowWhileIdle:true},channelId:'alarme',actionTypeId:'AVISO',extra:{id:a.id}}}
let agTimer=null;
function agendarNativo(){
 clearTimeout(agTimer);
 agTimer=setTimeout(async()=>{try{
  const pend=await LN.getPending();
  if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  const now=Date.now(),lista=[];let n=1;
  for(const a of S.ags){
   if(a.estado!=='pendente')continue;
   const t=new Date(a.dt).getTime();
   for(const m of a.leads){
    const at=t-m*60000;if(at<=now)continue;
    const corpo=montar(a,m);
    lista.push(mkNotif(n++,'Agenda Arretada',corpo,at,a));
    for(let r=1;r<=3;r++)lista.push(mkNotif(n++,'⏰ Ainda não concluiu!',corpo,at+r*60000,a));
   }
  }
  if(lista.length)await LN.schedule({notifications:lista.slice(0,400)});
 }catch(e){}},400);
}
async function prepararNativo(){
 try{
  await LN.requestPermissions();
  try{const e=await LN.checkExactNotificationSetting();if(e.exact_alarm!=='granted')await LN.changeExactNotificationSetting()}catch(e){}
  await LN.createChannel({id:'alarme',name:'Lembretes e alarmes',importance:5,visibility:1,vibration:true});
  await LN.registerActionTypes({types:[{id:'AVISO',actions:[{id:'concluir',title:'Concluir'}]}]});
  LN.addListener('localNotificationActionPerformed',e=>{
   if(e.actionId==='concluir'){const a=S.ags.find(x=>x.id===(e.notification.extra||{}).id);if(a){a.estado='concluido';save();render()}}
  });
 }catch(e){}
}
if(NATIVE&&LN){
 window.__sync=agendarNativo;
 const nota=document.querySelector('.nota');
